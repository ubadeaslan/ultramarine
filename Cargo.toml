[workspace]
resolver = "2"
members = ["crates/rank-eval", "crates/scan", "crates/qc-core"]
# cint-sys links libcint (Linux .so) -> builds only in WSL, excluded from the
# Windows-native workspace build.
exclude = ["crates/cint-sys"]

